name: Build

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 0"
  push:
    branches: [ master ]
    paths-ignore:
      - "**/README.md"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4
        with:
          path: code

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: code/go.mod

      - name: Set release tags
        run: |
          echo "RELEASE_NAME=$(date +%Y%m%d%H%M%S)" >> $GITHUB_ENV
          echo "TAG_NAME=$(date +%Y%m%d%H%M%S)" >> $GITHUB_ENV

      - name: Download data lists
        shell: bash
        env:
          CUSTOM_DOMAINS: "yaplakal.com habr.com"
        run: |
          set -euo pipefail
          mkdir -p raw_data
          mkdir -p data

          extract_all_domains() {
            local name="$1"
            local cache_file="raw_data/$name"
            
            if [[ ! -f "$cache_file" ]]; then
              echo "Downloading $name..." >&2
              curl --fail -s -L -o "$cache_file" \
                "https://raw.githubusercontent.com/v2fly/domain-list-community/master/data/$name" || return 0
            fi

            while IFS= read -r line || [[ -n "$line" ]]; do
              line=$(echo "${line%%#*}" | xargs)
              [[ -z "$line" ]] && continue

              if [[ "$line" =~ ^include: ]]; then
                local inc=$(echo "$line" | cut -d':' -f2- | xargs)
                extract_all_domains "$inc"
              else
                echo "$line" | awk '{print $1}' | sed -E 's/^(full:|domain:|keyword:)//' | cut -d'@' -f1
              fi
            done < "$cache_file"
          }

          super_filter() {
            awk -F. '{ print NF, $0 }' | sort -n | cut -d' ' -f2- | uniq | \
            awk -F. '{
              found = 0;
              for (i = NF; i >= 1; i--) {
                curr = "";
                for (j = i; j <= NF; j++) {
                  curr = (curr == "") ? $j : curr "." $j;
                }
                if (seen[curr]) { found = 1; break; }
              }
              if (!found) { seen[$0] = 1; print $0; }
            }'
          }

          for target in category-ru private; do
            echo "Processing $target..."
            {
              for d in $CUSTOM_DOMAINS; do echo "$d"; done
              extract_all_domains "$target"
            } | super_filter > "data/$target"
          done

      - name: Copy category-unblock-ru
        run: |
          cp -r code/data/category-unblock-ru data/ 2>/dev/null || true

      - name: Build geosite.dat
        run: |
          mkdir -p release
          cd code
          go mod tidy
          go run main.go \
            --datapath=../data \
            --outputdir=../release \
            --exportlists=category-unblock-ru,category-ru,private
          cd ..
          ls -R

      - name: Generate geosite.dat sha256 hash
        run: |
          sha256sum release/geosite.dat > release/geosite.dat.sha256sum
          cat release/geosite.dat.sha256sum

      - name: Create release and upload geosite.dat
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG_NAME" release/geosite.dat release/geosite.dat.sha256sum \
            --repo $GITHUB_REPOSITORY \
            --title "$RELEASE_NAME" \
            --notes "" \
            --draft=false \
            --prerelease=false
